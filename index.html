<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практика выполнения блоков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <section class="block block-header">
    <h1>Добро пожаловать!</h1>
    <p>Это пример простых блоков на странице.</p>
  </section>


  <section class="block block-info">
    <h2>О нас</h2>
    <p>Мы создаем крутые сайты и лендинги.</p>
  </section>

  <section class="block block-services">
    <h2>Наши услуги</h2>
    <div class="cards">
      <div class="card">Веб-дизайн</div>
      <div class="card">Верстка</div>
      <div class="card">Покупки</div>
    </div>
  </section>

  
  <section class="block block-contact">
    <h2>Связаться с нами</h2>
    <form>
      <input type="text" placeholder="Ваше имя">
      <input type="email" placeholder="Email">
      <button type="submit">Отправить</button>
    </form>
  </section>

</body>
</html>
